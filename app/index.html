<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacH3 Metal</title>
<style>
  :root { --bg:#f6f5f2; --fg:#1c1b19; --muted:#6b6862; --line:#d9d6cf; --accent:#2f5d50; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ecebe7; --muted:#9a978f; --line:#34332f; --accent:#7fb8a4; --card:#1e1e1c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:24px 16px 48px; display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:24px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font-size:20px; margin:0 0 2px; } .sub { color:var(--muted); margin:0 0 16px; font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  textarea, input, select { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); font:inherit; }
  textarea { min-height:200px; resize:vertical; font-size:13px; }
  .row { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .tiles { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .tile { position:relative; aspect-ratio: 4/5; border:1.5px dashed var(--line); border-radius:8px; background:var(--card); display:flex; align-items:center; justify-content:center; text-align:center; font-size:13px; color:var(--muted); cursor:pointer; overflow:hidden; }
  .tile:hover, .tile.over { border-color:var(--accent); color:var(--accent); }
  .tile input { display:none; }
  .tile.full { border-style:solid; } .tile span { position:relative; z-index:1; }
  .tile.full span { position:absolute; left:4px; bottom:4px; padding:2px 6px; border-radius:4px; background:rgba(0,0,0,.55); color:#fff; font-size:11px; } .tile.full small { display:none; } .tile.full span br { display:none; }
  .tile .pics { position:absolute; inset:0; display:flex; } .tile .pics img { flex:1; min-width:0; object-fit:cover; }
  .tile .x { display:none; position:absolute; top:4px; right:4px; width:24px; height:24px; padding:0; border-radius:12px; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:16px; line-height:24px; }
  .tile.full .x { display:block; }
  .tile.off { opacity:.35; pointer-events:none; }
  .mode { font-size:13px; color:var(--muted); margin-top:8px; } .mode b { color:var(--fg); font-weight:600; } .mode .warn { color:#b3412f; }
  .seg { display:grid; grid-template-columns: repeat(3, 1fr); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg label { margin:0; text-transform:none; letter-spacing:0; font-size:14px; } .seg input { display:none; }
  .seg span { display:block; padding:8px; text-align:center; cursor:pointer; color:var(--fg); background:var(--card); }
  .seg label + label span { border-left:1px solid var(--line); }
  .seg input:checked + span { background:var(--accent); color:var(--bg); }
  .buttons { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  button { padding:10px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:var(--bg); font:inherit; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:16px; } .bar > div { height:100%; width:0; background:var(--accent); transition:width .4s; }
  .status { font-size:13px; color:var(--muted); margin-top:6px; min-height:1.4em; } .err { color:#b3412f; }
  video { width:100%; max-height:70vh; background:#000; border-radius:8px; }
  ol { padding-left:20px; font-size:13px; color:var(--muted); } ol li { margin:6px 0; } ol a { color:var(--accent); }
  ol q { color:var(--fg); }
  .now { margin-top:14px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); font-size:13px; display:none; }
  .now q { display:block; margin-top:4px; font-size:15px; color:var(--fg); }
  .who { display:flex; gap:8px; align-items:center; margin:10px 0 0; font-size:12px; color:var(--muted); } .who img { width:48px; height:48px; object-fit:cover; border-radius:50%; border:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <section>
    <h1>MacH3 Metal</h1>
    <p class="sub">MiniMax-H3 picture and sound on this Mac, on the h3c Metal engine through ComfyUI and the Comfy API. Add pictures to steer it; continue any take from where it ended.</p>
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="Describe the shot. Cite identity pictures as Picture 1, Picture 2."></textarea>
    <label>Pictures (optional, drop or click)</label>
    <div class="tiles">
      <div class="tile" data-k="first"><input type="file" accept="image/png,image/jpeg"><span>Start frame</span><button class="x" title="clear">&times;</button></div>
      <div class="tile" data-k="last"><input type="file" accept="image/png,image/jpeg"><span>End frame</span><button class="x" title="clear">&times;</button></div>
      <div class="tile" data-k="refs"><input type="file" accept="image/png,image/jpeg" multiple><span>Who is in it<br><small>up to 2</small></span><button class="x" title="clear">&times;</button></div>
    </div>
    <div class="mode" id="mode"></div>
    <label>Frame</label>
    <div class="seg" id="size">
      <label><input type="radio" name="size" value="544x960" checked><span>Portrait</span></label>
      <label><input type="radio" name="size" value="960x544"><span>Landscape</span></label>
      <label><input type="radio" name="size" value="736x736"><span>Square</span></label>
    </div>
    <div class="row">
      <div><label for="seconds">Length (s)</label><input id="seconds" type="number" value="5" min="1" max="15" step="0.5"></div>
      <div><label for="seed">Seed</label><input id="seed" type="number" value="77001"></div>
      <div><label for="steps">Steps</label><input id="steps" type="number" value="8" min="2" max="50"></div>
    </div>
    <div class="buttons">
      <button id="new">Generate</button>
      <button id="cont" class="secondary" disabled>Continue the take</button>
      <button id="stop" class="secondary" disabled>Stop</button>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="status" id="status">idle</div>
    <div class="now" id="now"></div>
  </section>
  <section>
    <video id="video" controls playsinline></video>
    <div class="who" id="who"></div>
    <ol id="takes"></ol>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let refs = [], frames = {}, shown = null, hasTakes = false;
const readFile = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
// The mode follows from which picture slots are filled.
const pickMode = () => {
  const r = refs.length > 0, f = !!frames.first, l = !!frames.last;
  if (l && !f) return null;
  return r ? (f ? (l ? 'references + first + last frame' : 'references + first frame') : 'references')
           : (f ? (l ? 'first + last frame' : 'first frame') : 'text to video');
};
const showMode = () => {
  const m = pickMode();
  $('mode').innerHTML = m ? `Mode: <b>${m}</b>` : '<span class="warn">An end frame needs a start frame.</span>';
  $('new').disabled = !m || $('new').dataset.busy === '1';
};
async function setTile(tile, files) {
  const k = tile.dataset.k, imgs = [...files].filter(f => /^image\/(png|jpeg)$/.test(f.type));
  if (k === 'refs') refs = await Promise.all(imgs.slice(0, 2).map(readFile));
  else frames[k] = imgs[0] ? await readFile(imgs[0]) : undefined;
  const urls = k === 'refs' ? refs : (frames[k] ? [frames[k]] : []);
  tile.querySelector('.pics')?.remove();
  if (urls.length) tile.insertAdjacentHTML('afterbegin', `<div class="pics">${urls.map(u => `<img src="${u}" alt="">`).join('')}</div>`);
  tile.classList.toggle('full', urls.length > 0);
  showMode();
}
for (const tile of document.querySelectorAll('.tile')) {
  const input = tile.querySelector('input');
  tile.onclick = e => { if (!e.target.classList.contains('x')) input.click(); };
  input.onchange = () => setTile(tile, input.files);
  tile.querySelector('.x').onclick = e => { e.stopPropagation(); input.value = ''; setTile(tile, []); };
  tile.ondragover = e => { e.preventDefault(); tile.classList.add('over'); };
  tile.ondragleave = () => tile.classList.remove('over');
  tile.ondrop = e => { e.preventDefault(); tile.classList.remove('over'); setTile(tile, e.dataTransfer.files); };
}
async function go(cont) {
  const [width, height] = document.querySelector('input[name=size]:checked').value.split('x').map(Number);
  const body = { width, height, mode: pickMode(), prompt: $('prompt').value, seconds: +$('seconds').value, seed: +$('seed').value, steps: +$('steps').value, continue: cont,
    refs: cont ? [] : refs, first: cont ? undefined : frames.first, last: cont ? undefined : frames.last };
  const r = await fetch('/api/take', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { $('status').textContent = (await r.json()).error; return; }
  $('seed').value = +$('seed').value + 1;
}
$('new').onclick = () => go(false);
$('cont').onclick = () => go(true);
$('stop').onclick = () => fetch('/api/cancel', { method: 'POST' });
async function poll() {
  try {
    const s = await (await fetch('/api/state')).json();
    const busy = !['idle', 'done', 'failed', 'succeeded'].includes(s.status);
    $('bar').style.width = (s.progress * 100).toFixed(1) + '%';
    $('status').innerHTML = s.error ? `<span class="err">${s.error}</span>` : (busy ? `${s.status}, ${(s.progress * 100).toFixed(0)}%` : s.status);
    $('new').dataset.busy = busy ? '1' : ''; showMode(); $('cont').disabled = busy || !s.takes.length; $('stop').disabled = !busy;
    const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    $('now').style.display = s.current ? 'block' : 'none';
    if (s.current) $('now').innerHTML = `Rendering take ${s.current.n}, ${s.current.seconds} s, seed ${s.current.seed}${s.current.n > 1 ? ', continuing take ' + (s.current.n - 1) : ''}<q>${esc(s.current.line)}</q>`;
    $('who').innerHTML = s.refs.length ? s.refs.map(r => `<img src="/media/${r}" alt="">`).join('') + '<span>identity, cited as Picture 1' + (s.refs.length > 1 ? ', 2' : '') + '</span>' : '';
    $('takes').innerHTML = s.takes.map(t => `<li><a href="/media/${t.video}" target="_blank">take ${t.n}</a>, ${t.seconds} s, ${Math.round(t.wall / 60 * 10) / 10} min<br><q>${esc(t.line)}</q></li>`).join('') +
      (s.takes.length > 1 ? `<li><a href="/media/${s.joined}" target="_blank">joined take</a></li>` : '');
    if (s.joined && s.joined !== shown) { shown = s.joined; $('video').src = '/media/' + s.joined; }
  } catch (e) {}
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
</html>
